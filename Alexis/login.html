<!DOCTYPE html>
<html class="html-login" lang="es">
<head >
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incio Sesion - HouskyTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/alexis.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link
    href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
    rel="stylesheet"
    />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body class="pagina-login">
<!-- nav -->
<header>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/index.html">
                <i class="bi bi-cpu-fill me-2"></i>HouskyTech
            </a>
        </div>
    </nav>
</header>
<!-- login -->
<section>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card form-login">
                <h2 class="text-center mb-4">Iniciar sesión</h2>
                <form>
                    <!-- corrweo -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="ParraEsGay@correo.com" required>
                    </div>
                    <!-- contraseña -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="********" required>
                    </div>
                    <!-- boton pal login -->
                    <a href="/pages/alexis.html" class="btn boton-registro w-100">Entrar</a>
                </form>
                <!-- por si no tiene cuenta -->
                <div>
                    <p class="text-center mt-3">
                        No tienes una cuenta? 
                        <a href="/Alexis/registro.html" class="text-decoration-none">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</section>

<!-- footer -->
<footer class="bg-dark text-light py-4 mt-auto">
    <div class="container">
        <div class="row text-center text-md-start align-items-center">
            <div class="col-12 col-md-6 mb-3 mb-md-0">
                <p class="mb-0">&copy; 2025 HouskyTech. Todos los derechos reservados.</p>
            </div>
            <div class="col-12 col-md-6 text-center text-md-end">
                <a href="#" class="text-light me-3"><i class="bi bi-facebook fs-5"></i></a>
                <a href="https://www.instagram.com/alexhousky/" target="_blank" class="text-light me-3"><i class="bi bi-instagram fs-5"></i></a>
                <a href="#" class="text-light"><i class="bi bi-whatsapp fs-5"></i></a>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/Alexis/js.js"></script>
</body>
</html>
